<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Over Color Change</title>
</head>
<body>
    <div id="mouse"    
         onmouseover="mouseover()"
         style = "height:100px; width:200px; background-color: blue;">
        div box
    </div>
    <script>
        function mouseover(){
            document.getElementById("mouse").style.backgroundColor ="red";
        }
    </script>

</body>
</html>
