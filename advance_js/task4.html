<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double click</title>
</head>
<body>
    <button ondblclick="doubleclick()"> Click Me</button>
    <p id="click"></p>
    <script>
        function doubleclick(){
            document.getElementById("click").innerHTML = "Button Double Clicked"
        }
    </script>
</body>
</html>
