<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Click Event Example</title>
</head>
<body>
    <button onclick = "displayMessage()">Click Me</button>
    <p id="welcome"></p>

    <script>
        function displayMessage(){
            document.getElementById("welcome").innerHTML="wlcome to javascript events"
        }
    </script>

</body>
</html>
