<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class-Based Card Styling</title>
    <style>
        .box{
            height:50px;
            width:100px;
            background-color: chocolate;
            display:inline-flex;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="box">Box1</div>
    <div class="box">Box2</div>
    <div class="box">Box3</div>
    <div class="box">Box4</div>
    <div class="box">Box5</div>
    <div class="box">Box6</div>

    <button onclick= "changestyle()">Click Me to change style</button>

    <script>
        function changestyle(){
            let cards = document.getElementsByClassName("box");

            for(let i=0 ; i<cards.length ;i++){
                cards[i].style.backgroundColor = "blue";
                cards[i].style.borderColor = "orange";
            }

        }
    </script>
</body>
</html>
