<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HighLight Paragraph</title>
</head>
<body>
    <p id = "paragraph" onmouseenter = "highlightparagraph()" >this is the paragraph</p>
    <script>
        function highlightparagraph(){
            document.getElementById("paragraph").style.backgroundColor="red";
        }
    </script>
</body>
</html>
