<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Input text</title>
</head>
<body>
    <h2> Enter your Name :</h2>
    <input type="text" id="name"  onchange="displaytext()">
    <p id="output"></p>
    <script>
        function  displaytext(){
            let text = document.getElementById("name").value;
            document.getElementById("output").innerHTML = "Your name is:" + text;
        }
    </script>
</body>
</html>
