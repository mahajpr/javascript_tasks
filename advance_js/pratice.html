<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event handling</title>
</head>
<body>
    <button onclick="display()">Click Me</button>
    <p id="onclick"></p>

    <script>
        function display(){
            document.getElementById("onclick").innerHTML="this is the onclick event"
        }
    </script>
    
</body>
</html>
